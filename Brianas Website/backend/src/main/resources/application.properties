spring.application.name=realtor-backend
server.port=9000

# Local development defaults use PostgreSQL so the frontend and backend talk to the same DB.
# Override these values with environment variables if your local setup differs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/realtor_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.sql.init.mode=always
