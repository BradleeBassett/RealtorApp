spring.application.name=realtor-backend
server.port=9000

# Local development defaults use PostgreSQL so the frontend and backend talk to the same DB.
# Override these values with environment variables if your local setup differs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/realtor_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.sql.init.mode=always

# Set JWT_SECRET to a unique, random value of at least 32 characters before deployment.
app.jwt.secret=${JWT_SECRET:development-only-change-this-jwt-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.public-url=${APP_PUBLIC_URL:http://localhost:9000}
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.email-verification.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
